<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Install Roblox on Linux</title>
    <link rel="icon" type="image/png" href="fav.png">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #0d1520);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(45, 45, 45, 0.9);
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            color: #00c6ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100,200,255,0.7);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.85;
        }
        .download-btn {
            padding: 14px 36px;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,198,255,0.2);
        }
        .download-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 30px rgba(0,198,255,0.4);
        }
        .instructions {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #ccc;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Instalar Roblox no Linux</h1>
        <p>Baixe o instalador abaixo e execute no seu sistema Linux.</p>
        <a href="instalar_roblox_linux.sh" download>
            <button class="download-btn">Baixar instalador</button>
        </a>
        <div class="instructions">
            <strong>Como usar:</strong><br>
            1. Baixe o arquivo.<br>
            2. Abra o terminal na pasta do arquivo.<br>
            3. Execute: <code>chmod +x instalar_roblox_linux.sh && ./instalar_roblox_linux.sh</code>
        </div>
    </div>
</body>
</html>
